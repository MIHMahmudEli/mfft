events {}

http {
    upstream web {
        server web:3000;
    }

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1 imageverify.ai www.imageverify.ai;

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_max_body_size 50M;
        }

        location /predict {
            proxy_pass http://api/predict;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            client_max_body_size 50M;
        }
    }
}
